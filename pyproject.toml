[project]
name = "ibkr-proxy"
version = "0.1.0"
description = "FastAPI broker proxy over IBKR, packaged with gnzsnz/ib-gateway."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.128.8",
    "uvicorn>=0.39.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.11.0",
    "httpx>=0.28.1",
    "ib_async>=2.1.0",
    "numpy>=2.2.6",
    "nest-asyncio>=1.6.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
